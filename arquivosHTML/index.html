<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tickets</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div id="alerta-sucesso" class="alerta-container">
    <span id="mensagem-sucesso"></span>
    <button onclick="this.parentElement.style.display='none'">×</button>
</div>

<div id="alerta-erro" class="alerta-container">
    <span id="mensagem-erro"></span>
    <button onclick="this.parentElement.style.display='none'">×</button>
</div>

    <div id="login" class="login">
        <h1 class="letra">Entre na sua conta</h1>
        <input type="text" placeholder="Digite o nome de usuário">
        <input type="password" placeholder="Digite sua senha"><br>
        <button id="btnEntrar">entrar</button>
        <button id="abrir-cadastro">Inscreva-se</button>
    </div>
    <div id="signup" class="signup">
        <h1 class="letra">Inscreva-se</h1>
        <input type="text" id="nomeusuario" placeholder="Digite o nome de usuário">
        <input type="password" id="cadastrosenha" placeholder="Digite sua senha"><br>
        <button id="criarconta">Criar Conta</button>
        <button id="voltar-login">Voltar</button>
    </div>
<script src="../telasjs/login.js"></script>
<script src="../telasjs/signup.js"></script>
<script src="../telasjs/main.js"></script>
</body>
</html>
