<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criar Chamado - Sistema de Tickets</title>
    <link rel="stylesheet" href="../ticketss.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h2 class="logo-text">Sistema de Chamados</h2>
            <div class="header-actions">
                <a href="lista-tickets.html" class="btn-nav">Meus Tickets</a>
                <button id="btnSair" class="btn-sair">Sair</button>
            </div>
        </div>
    </header>

    <main class="content-wrapper">
        <div class="tickets-container">
            <h1 class="letra">Criar Novo Chamado</h1>
            
            <input type="text" id="tituloTicket" placeholder="Título do ticket"> 
            
            <div class="options-group">
                <div class="ticket-item">
                    <input type="checkbox" id="checkBug" value="Bug no sistema">
                    <label for="checkBug">Bug no sistema</label>
                </div>
                <div class="ticket-item">
                    <input type="checkbox" id="checkMaterial" value="Requisição de material">
                    <label for="checkMaterial">Requisição de material</label>
                </div>
                <div class="ticket-item">
                    <input type="checkbox" id="checkHardware" value="Erro de hardware">
                    <label for="checkHardware">Erro de hardware</label>
                </div>
                <div class="ticket-item">
                    <input type="checkbox" id="checkHardware" value="teste">
                    <label for="checkHardware">teste</label>
                </div>
            </div>
            
            <input type="text" id="descricaoTicket" placeholder="Descrição do ticket">
            <button id="btnsaveticket">Salvar Ticket</button>
        </div>
    </main>

    <div id="alerta-sucesso" class="alerta sucesso">
        <span id="mensagem-sucesso"></span>
    </div>
    <div id="alerta-erro" class="alerta erro">
        <span id="mensagem-erro"></span>
    </div>

    <script src="../telasjs/ticket.js"></script>
</body>
</html>
